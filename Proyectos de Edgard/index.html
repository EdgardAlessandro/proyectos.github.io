<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Registro Estudiantil</title>
  <style>
:root{
  --fondo:#f4efe6; --panel:#fffdf8; --tinta:#26221c; --suave:#7a7366; --linea:#ddd3c1;
  --acento:#c4501b; --acento-tinta:#fff; --campo:#faf6ee; --error:#b3261e; --ok:#2f6b3f; --codigo:#efe7d6;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --fondo:#14161c; --panel:#1d2029; --tinta:#ece8df; --suave:#9a968c; --linea:#313543;
    --acento:#ff8a4c; --acento-tinta:#1a120c; --campo:#161921; --error:#ff8c82; --ok:#7fd08f; --codigo:#262a36;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45}
.barra{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px clamp(16px,4vw,40px);border-bottom:3px solid var(--acento);background:var(--panel)}
.etiqueta{margin:0;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acento);font-weight:700}
h1{margin:2px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.3rem,3vw,1.9rem)}
h2{margin:0 0 14px;font-family:Georgia,serif;font-size:1.15rem}
.contador{text-align:center;background:var(--codigo);border-radius:10px;padding:8px 18px}
.contador strong{display:block;font-size:1.8rem;line-height:1.1;font-family:Georgia,serif;color:var(--acento)}
.contador span{font-size:.75rem;color:var(--suave)}

.layout{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px clamp(16px,4vw,40px);align-items:start}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:20px}
.datos{display:grid;gap:20px;min-width:0}

label{display:block;font-size:.85rem;font-weight:700;margin-bottom:14px;color:var(--suave)}
form input,form select{display:block;width:100%;margin-top:5px;font:inherit;font-weight:400;color:var(--tinta);background:var(--campo);border:1px solid var(--linea);border-radius:8px;padding:10px 12px}
input:focus-visible,select:focus-visible,button:focus-visible,.btn:focus-within{outline:3px solid var(--acento);outline-offset:2px}
.malo{border-color:var(--error)!important;box-shadow:0 0 0 1px var(--error)}

.btn{font:inherit;font-weight:700;font-size:.85rem;letter-spacing:.05em;border-radius:8px;padding:11px 14px;cursor:pointer;text-align:center;margin:0;display:block}
.btn.llena{width:100%;border:0;background:var(--acento);color:var(--acento-tinta);margin-top:6px}
.btn.borde{border:2px solid var(--acento);background:transparent;color:var(--acento)}
.btn:hover{filter:brightness(1.1)}
#aviso{min-height:1.3em;margin:10px 0 0;font-size:.9rem}
#aviso.error{color:var(--error)} #aviso.ok{color:var(--ok)}

.encabezado{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.encabezado h2{margin:0}
#buscar{font:inherit;color:var(--tinta);background:var(--campo);border:1px solid var(--linea);border-radius:8px;padding:8px 12px;min-width:220px}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}

.scroll{overflow-x:auto;border:1px solid var(--linea);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--linea)}
th{background:var(--codigo);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
tbody tr:last-child td{border-bottom:0}
td.cod{font-family:Consolas,"Courier New",monospace;font-weight:700;color:var(--acento)}
td small{display:block;color:var(--suave)}
.vacio{text-align:center;color:var(--suave);white-space:normal;padding:22px}
.quitar{background:none;border:1px solid var(--linea);color:var(--error);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit;font-size:.8rem}
.quitar:hover{border-color:var(--error)}

.ayuda{margin:0 0 10px;font-size:.9rem;color:var(--suave)}
.barra-sep{color:var(--acento);font-weight:700;font-family:Consolas,monospace}
pre{margin:0;padding:14px;background:var(--campo);border:1px solid var(--linea);border-radius:8px;overflow-x:auto;font-family:Consolas,"Courier New",monospace;font-size:.82rem;line-height:1.7}
pre .sep{color:var(--acento);font-weight:700}
pre .vacio-txt{color:var(--suave)}

@media (max-width:860px){.layout{grid-template-columns:1fr}}
@media (max-width:480px){.botones{grid-template-columns:1fr}}

</style>
</head>
<body>
<header class="barra">
  <div>
    <p class="etiqueta">Proyecto 1</p>
    <h1>Sistema de Registro Estudiantil</h1>
  </div>
  <div class="contador"><strong id="total">0</strong><span>estudiantes</span></div>
</header>

<div class="layout">
  <!-- COLUMNA IZQUIERDA: formulario -->
  <aside class="panel">
    <h2>Registro estudiantil</h2>
    <form id="formulario" novalidate>
      <label>Nombre completo
        <input id="nombre" type="text" autocomplete="off">
      </label>
      <label>NIE
        <input id="nie" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <label>Edad
        <input id="edad" type="number" min="5" max="99">
      </label>
      <label>Grado
        <select id="grado">
          <option value="">Seleccionar</option>
          <option>1.er Desarrollo de Software</option>
          <option>2.o Desarrollo de Software</option>
          <option>3.er Desarrollo de Software</option>
        </select>
      </label>
      <label>Sección
        <select id="seccion">
          <option value="">Seleccionar</option>
          <option>A</option>
          <option>B</option>
          <option>C</option>
        </select>
      </label>
      <label>Correo
        <input id="correo" type="email" autocomplete="off">
      </label>
      <label>Teléfono
        <input id="telefono" type="tel" inputmode="numeric" autocomplete="off">
      </label>
      <button type="submit" class="btn llena">REGISTRAR ESTUDIANTE</button>
      <p id="aviso" role="alert"></p>
    </form>
  </aside>

  <!-- COLUMNA DERECHA: datos -->
  <div class="datos">
    <section class="panel">
      <div class="encabezado">
        <h2>Estudiantes</h2>
        <input id="buscar" type="search" placeholder="Buscar por nombre o NIE…" aria-label="Buscar">
      </div>
      <div class="botones">
        <button type="button" id="btnDescargar" class="btn borde">DESCARGAR ESTUDIANTES.TXT</button>
        <label class="btn borde" for="archivo">CARGAR ARCHIVO TXT</label>
        <input id="archivo" type="file" accept=".txt,text/plain" hidden>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Código</th><th>Nombre</th><th>NIE</th><th>Edad</th><th>Grado</th><th>Sección</th><th>Contacto</th><th></th></tr>
          </thead>
          <tbody id="cuerpo"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>estudiantes.txt</h2>
      <p class="ayuda">Cada línea es un <b>registro</b>; cada dato separado por <span class="barra-sep">|</span> es un <b>campo</b>.</p>
      <pre id="vista"></pre>
    </section>
  </div>
</div>
<script>
"use strict";

// ================= ESTADO =================
// Cada objeto del arreglo es un REGISTRO; cada propiedad es un CAMPO.
let estudiantes = [];

const CAMPOS = ["codigo", "nombre", "nie", "edad", "grado", "seccion", "correo", "telefono"];
const SEPARADOR = "|";

// ================= ELEMENTOS =================
const $ = (id) => document.getElementById(id);
const formulario = $("formulario");
const cuerpo = $("cuerpo");
const vista = $("vista");
const aviso = $("aviso");
const buscar = $("buscar");

// ================= FUNCIONES AUXILIARES =================
function avisar(texto, tipo) {
  aviso.textContent = texto;
  aviso.className = tipo;
}

// 7 -> "007"
const formatearCodigo = (n) => String(n).padStart(3, "0");

// Calcula el siguiente código a partir del mayor que exista
function siguienteCodigo() {
  const mayor = estudiantes.reduce((max, e) => Math.max(max, parseInt(e.codigo, 10) || 0), 0);
  return formatearCodigo(mayor + 1);
}

// Un registro (objeto) -> una línea de texto
const registroALinea = (e) => CAMPOS.map((c) => e[c]).join(SEPARADOR);

// Todos los registros -> contenido del archivo
const generarTexto = () => estudiantes.map(registroALinea).join("\r\n");

// Una línea de texto -> un registro (objeto), o null si no tiene 8 campos
function lineaARegistro(linea) {
  const partes = linea.split(SEPARADOR);
  if (partes.length !== CAMPOS.length) return null;
  const registro = {};
  CAMPOS.forEach((campo, i) => (registro[campo] = partes[i].trim()));
  return registro;
}

// ================= PINTAR EN PANTALLA =================
function pintarTabla() {
  const filtro = buscar.value.trim().toLowerCase();
  const visibles = estudiantes.filter(
    (e) => e.nombre.toLowerCase().includes(filtro) || e.nie.includes(filtro)
  );

  cuerpo.innerHTML = "";

  if (visibles.length === 0) {
    const fila = cuerpo.insertRow();
    const celda = fila.insertCell();
    celda.colSpan = 8;
    celda.className = "vacio";
    celda.textContent = estudiantes.length === 0
      ? "Aún no hay estudiantes registrados."
      : "Ningún estudiante coincide con la búsqueda.";
    return;
  }

  visibles.forEach((e) => {
    const fila = cuerpo.insertRow();
    const celdaCodigo = fila.insertCell();
    celdaCodigo.className = "cod";
    celdaCodigo.textContent = e.codigo;
    fila.insertCell().textContent = e.nombre;
    fila.insertCell().textContent = e.nie;
    fila.insertCell().textContent = e.edad;
    fila.insertCell().textContent = e.grado;
    fila.insertCell().textContent = e.seccion;

    const contacto = fila.insertCell();
    contacto.textContent = e.correo;
    const tel = document.createElement("small");
    tel.textContent = e.telefono;
    contacto.appendChild(tel);

    const acciones = fila.insertCell();
    const quitar = document.createElement("button");
    quitar.type = "button";
    quitar.className = "quitar";
    quitar.textContent = "Quitar";
    quitar.addEventListener("click", () => eliminar(e.codigo));
    acciones.appendChild(quitar);
  });
}

function pintarVista() {
  vista.innerHTML = "";
  if (estudiantes.length === 0) {
    const vacio = document.createElement("span");
    vacio.className = "vacio-txt";
    vacio.textContent = "(el archivo está vacío)";
    vista.appendChild(vacio);
    return;
  }
  estudiantes.forEach((e, i) => {
    CAMPOS.forEach((campo, j) => {
      vista.appendChild(document.createTextNode(e[campo]));
      if (j < CAMPOS.length - 1) {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = SEPARADOR;
        vista.appendChild(sep);
      }
    });
    if (i < estudiantes.length - 1) vista.appendChild(document.createTextNode("\n"));
  });
}

function actualizar() {
  $("total").textContent = estudiantes.length;
  pintarTabla();
  pintarVista();
}

function eliminar(codigo) {
  estudiantes = estudiantes.filter((e) => e.codigo !== codigo);
  actualizar();
  avisar("Registro " + codigo + " eliminado.", "ok");
}

// ================= REGISTRAR =================
formulario.addEventListener("submit", (evento) => {
  evento.preventDefault(); // no recargar la página

  // 1. Capturar
  const entradas = {};
  CAMPOS.slice(1).forEach((c) => (entradas[c] = $(c)));
  const datos = {};
  for (const c in entradas) datos[c] = entradas[c].value.trim();

  // 2. Validar
  let errores = 0;
  for (const c in entradas) {
    const vacio = datos[c] === "";
    entradas[c].classList.toggle("malo", vacio);
    if (vacio) errores++;
  }
  if (errores > 0) return avisar("Completa los campos marcados en rojo.", "error");

  const edad = Number(datos.edad);
  if (!Number.isInteger(edad) || edad < 5 || edad > 99) {
    entradas.edad.classList.add("malo");
    return avisar("La edad debe ser un entero entre 5 y 99.", "error");
  }
  if (!/^\S+@\S+\.\S+$/.test(datos.correo)) {
    entradas.correo.classList.add("malo");
    return avisar("Escribe un correo válido, por ejemplo nombre@gmail.com.", "error");
  }
  const conSeparador = CAMPOS.slice(1).find((c) => datos[c].includes(SEPARADOR));
  if (conSeparador) {
    entradas[conSeparador].classList.add("malo");
    return avisar('No uses el carácter "|" en los datos.', "error");
  }
  if (estudiantes.some((e) => e.nie === datos.nie)) {
    entradas.nie.classList.add("malo");
    return avisar("Ya existe un estudiante con ese NIE.", "error");
  }

  // 3. Crear el registro
  const registro = { codigo: siguienteCodigo(), ...datos, edad: String(edad) };
  estudiantes.push(registro);

  // 4 y 5. Mostrar y actualizar el contenido del TXT
  actualizar();
  avisar("Estudiante " + registro.codigo + " registrado.", "ok");
  formulario.reset();
  $("nombre").focus();
});

buscar.addEventListener("input", pintarTabla);

// ================= DESCARGAR =================
$("btnDescargar").addEventListener("click", () => {
  if (estudiantes.length === 0) return avisar("No hay estudiantes para descargar.", "error");

  const blob = new Blob([generarTexto()], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.download = "estudiantes.txt";
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  URL.revokeObjectURL(url);
  avisar("Archivo estudiantes.txt descargado.", "ok");
});

// ================= CARGAR =================
$("archivo").addEventListener("change", (evento) => {
  const archivo = evento.target.files[0];
  if (!archivo) return;

  const lector = new FileReader();
  lector.onload = () => {
    const lineas = lector.result.split(/\r?\n/).filter((l) => l.trim() !== "");
    const registros = lineas.map(lineaARegistro);
    const validos = registros.filter((r) => r !== null);
    const omitidas = registros.length - validos.length;

    if (validos.length === 0) {
      avisar("El archivo no tiene registros válidos (8 campos separados por |).", "error");
    } else {
      estudiantes = validos;
      buscar.value = "";
      actualizar();
      avisar(validos.length + " registros cargados" + (omitidas ? ", " + omitidas + " líneas omitidas." : "."), "ok");
    }
    evento.target.value = "";
  };
  lector.onerror = () => avisar("No se pudo leer el archivo.", "error");
  lector.readAsText(archivo, "UTF-8");
});

actualizar();

</script>
</body>
</html>
