<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Cafetería - Proyectos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --tostado: #2a1a12;
      --taza: #3a261b;
      --borde: #5a4030;
      --espuma: #f1e6d3;
      --suave: #b9a48c;
      --caramelo: #e0a63e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: var(--tostado);
      color: var(--espuma);
      font-family: "Manrope", system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    #saludo {
      margin: 0 0 .5rem;
      color: var(--caramelo);
      font-weight: 600;
    }

    h1 {
      margin: 0 0 2.5rem;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 800;
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -.02em;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--borde);
    }

    li { border-bottom: 1px solid var(--borde); }

    a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem .5rem;
      color: var(--espuma);
      text-decoration: none;
      font-size: 1.2rem;
      transition: background .2s, padding-left .2s, color .2s;
    }

    a:hover,
    a:focus-visible {
      background: var(--taza);
      padding-left: 1.25rem;
      color: var(--caramelo);
      outline: none;
    }

    a:focus-visible { box-shadow: inset 3px 0 0 var(--caramelo); }

    kbd {
      flex: none;
      min-width: 1.9rem;
      padding: .1rem .5rem;
      border: 1px solid var(--borde);
      border-radius: 6px;
      color: var(--suave);
      font: 600 .85rem "Manrope", sans-serif;
      text-align: center;
    }

    .ayuda {
      margin-top: 1.5rem;
      color: var(--suave);
      font-size: .9rem;
    }

    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p id="saludo">Hola</p>
    <h1>Selecciona un Proyecto</h1>

    <ul id="proyectos">
      <li><a href="./ProyectoNumero1/"><kbd>1</kbd> Proyecto de Formulario</a></li>
      <li><a href="./CalculoDeNotas2/"><kbd>2</kbd> Proyecto 2 - Notas</a></li>
      <li><a href="./cafeteriaCafeNuevo/"><kbd>3</kbd> Productos de Café</a></li>
    </ul>

    <p class="ayuda">Pulsa 1, 2 o 3 para abrir un proyecto.</p>
  </main>

  <script>
    const hora = new Date().getHours();
    let saludo = "Buenas noches";
    if (hora >= 6 && hora < 12) saludo = "Buenos días";
    else if (hora >= 12 && hora < 19) saludo = "Buenas tardes";
    document.getElementById("saludo").textContent = saludo + " ☕";

    const enlaces = document.querySelectorAll("#proyectos a");
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const i = parseInt(e.key, 10) - 1;
      if (enlaces[i]) window.location.href = enlaces[i].href;
    });
  </script>
</body>
</html>
